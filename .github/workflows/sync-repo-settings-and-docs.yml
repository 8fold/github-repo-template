name: Sync Labels and Triage Docs

on:
  schedule:
    - cron: '0 0 1 */3 *' # Quarterly execution
  workflow_dispatch:     # Manual trigger

# Grant minimum default GITHUB_TOKEN permissions
permissions:
  contents: read

jobs:
  sync-assets:
    name: Sync Assets from Private Source
    runs-on: ubuntu-latest
    # Execute only if SOURCE_REPO variable exists AND current repo is not the source repo
    if: ${{ vars.SOURCE_REPO != '' && github.repository != vars.SOURCE_REPO }}

    steps:
      - name: Generate Ephemeral GitHub App Access Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Target Repo
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Checkout Private Source Repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SOURCE_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: temp-source-repo

      - name: Sync Triage Markdown File
        run: |
          mkdir -p docs
          cp temp-source-repo/docs/issue-triage.md docs/issue-triage.md
          rm -rf temp-source-repo

      - name: Commit and Push File Updates
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # Pass outputs via env vars to prevent inline script injection
          BOT_ID=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          # Authenticate git remote push using the ephemeral app token
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git add docs/issue-triage.md
          if ! git diff --cached --quiet; then
            git commit -m "sync: update docs/issue-triage.md from upstream source"
            git push
          fi

      - name: Sync Labels via GitHub API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_REPO: ${{ vars.SOURCE_REPO }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          # Retrieve label payload from private source repository
          gh api "repos/$SOURCE_REPO/labels" --paginate > source_labels.json

          # Upsert labels into current target repository with safe shell expansion
          jq -c '.[]' source_labels.json | while read -r label; do
            NAME=$(echo "$label" | jq -r '.name')
            COLOR=$(echo "$label" | jq -r '.color')
            DESC=$(echo "$label" | jq -r '.description // ""')

            # URL-encode label name for PATCH/GET API endpoints
            ENCODED_NAME=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$NAME")

            gh api "repos/$TARGET_REPO/labels/$ENCODED_NAME" \
              -X PATCH -f color="$COLOR" -f description="$DESC" 2>/dev/null || \
            gh api "repos/$TARGET_REPO/labels" \
              -X POST -f name="$NAME" -f color="$COLOR" -f description="$DESC"
          done
