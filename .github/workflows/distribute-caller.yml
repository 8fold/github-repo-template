name: Distribute Caller Workflow Across Org

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-triage-reusable-public.yml'
      - '.github/workflows/sync-templates.yml'
      - '.github/workflows/sync-caller-public.yml'

jobs:
  distribute:
    name: Propagate Caller File to All Org Repos
    runs-on: ubuntu-latest

    steps:
      - name: Generate Cross-Repo GitHub App Access Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Master Source Repo
        uses: actions/checkout@v6.0.2

      - name: Push Updated Caller File to All Org Repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ github.event.repository.name }}
        run: |
          # Locate the active caller file path
          if [ -f .github/workflows/sync.yml ]; then
            CALLER_PATH=".github/workflows/sync.yml"
          else
            CALLER_PATH=".github/workflows/sync-caller-public.yml"
          fi

          # Encode caller contents to Base64 for the GitHub Contents API
          CALLER_CONTENT=$(base64 -w 0 "$CALLER_PATH")

          # Fetch all repositories under the organization
          REPOS=$(gh api "orgs/$ORG_NAME/repos?per_page=100" --jq '.[].name')

          for repo in $REPOS; do
            # Skip the template source repository itself
            if [ "$repo" = "$SOURCE_REPO" ]; then
              continue
            fi

            echo "Updating caller workflow in repository: $repo"

            # Obtain existing file SHA if present to allow atomic updates
            SHA=$(gh api "repos/$ORG_NAME/$repo/contents/.github/workflows/sync-caller-public.yml" --jq '.sha' 2>/dev/null || echo "")

            if [ -n "$SHA" ]; then
              PAYLOAD=$(jq -n --arg msg "sync: update caller workflow" --arg content "$CALLER_CONTENT" --arg sha "$SHA" \
                '{message: $msg, content: $content, sha: $sha}')
            else
              PAYLOAD=$(jq -n --arg msg "sync: add caller workflow" --arg content "$CALLER_CONTENT" \
                '{message: $msg, content: $content}')
            fi

            # Create or update .github/workflows/sync-caller-public.yml via GitHub REST API
            gh api "repos/$ORG_NAME/$repo/contents/.github/workflows/sync-caller-public.yml" \
              -X PUT --input - <<< "$PAYLOAD" || echo "Failed to update $repo"
          done
