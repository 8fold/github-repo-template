name: Distribute Caller Workflow Across Org

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync.yml'
      - '.github/workflows/sync-templates.yml'
      - '.github/workflows/sync-triage.yml'
  workflow_dispatch:     # Manual trigger

jobs:
  distribute:
    name: Propagate Caller File to All Org Repos
    runs-on: ubuntu-latest

    steps:
      - name: Generate Cross-Repo GitHub App Access Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Master Source Repo
        uses: actions/checkout@v6.0.2

      - name: Push Updated Caller File to All Org Repos
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ github.event.repository.name }}
        run: |
          # 1. Locate source caller file in repo-skeleton
          if [ -f .github/workflows/sync.yml ]; then
            CALLER_PATH=".github/workflows/sync.yml"
          else
            CALLER_PATH=".github/workflows/sync-caller-public.yml"
          fi

          # 2. Encode caller contents to Base64 for GitHub Contents API
          CALLER_CONTENT=$(base64 -w 0 "$CALLER_PATH")

          # 3. Standard target path in downstream repositories
          TARGET_PATH=".github/workflows/sync.yml"

          # 4. Fetch all repositories under the organization
          # REPOS=$(gh api "orgs/$ORG_NAME/repos?per_page=100" --jq '.[].name')
          REPOS=$(gh api "orgs/$ORG_NAME/repos?per_page=100" --jq '.[] | select(.archived == false) | .name')

          for repo in $REPOS; do
            # Skip the template source repository itself
            if [ "$repo" = "$SOURCE_REPO" ]; then
              continue
            fi

            echo ""
            echo "Updating caller workflow in repository: $repo"

            # Obtain existing file SHA if present to allow atomic updates
            SHA=$(gh api "repos/$ORG_NAME/$repo/contents/$TARGET_PATH" --jq '.sha' 2>/dev/null || echo "")

            if [ -n "$SHA" ]; then
              PAYLOAD=$(jq -n --arg msg "sync: update governance caller workflow" --arg content "$CALLER_CONTENT" --arg sha "$SHA" \
                '{message: $msg, content: $content, sha: $sha}')
            else
              PAYLOAD=$(jq -n --arg msg "sync: add governance caller workflow" --arg content "$CALLER_CONTENT" \
                '{message: $msg, content: $content}')
            fi

            # Create or update .github/workflows/sync.yml via GitHub REST API
            # gh api "repos/$ORG_NAME/$repo/contents/$TARGET_PATH" \
            #  -X PUT --input - <<< "$PAYLOAD" || echo "Failed to update $repo"
            gh api "repos/$ORG_NAME/$repo/contents/$TARGET_PATH" \
              -X PUT --input - <<< "$PAYLOAD" > /dev/null && echo "☑" || echo "Failed to update $repo"
          done
