name: Distribute All Governance Assets Across Org

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'SECURITY.md'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/distribute-governance.yml'
  schedule:
    - cron: '0 0 1 */3 *'    # Quarterly sync
  workflow_dispatch:          # Manual trigger

jobs:
  distribute-governance:
    name: Propagate Governance Assets & Sync Labels
    runs-on: ubuntu-latest

    steps:
      - name: Generate Cross-Repo GitHub App Access Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Master Source Repo
        uses: actions/checkout@v6.0.2

      - name: Push Governance Assets and Sync Labels across Org
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG_NAME: ${{ github.repository_owner }}
          SOURCE_REPO: ${{ github.event.repository.name }}
        run: |
          FAIL_COUNT=0
          FAILED_REPOS=()

          # Helper function to push/update a single file via REST API silently if content changed
          sync_file() {
            local target_repo="$1"
            local file_path="$2"

            if [ ! -f "$file_path" ]; then
              return 0
            fi

            local local_sha
            local_sha=$(git hash-object "$file_path")

            local remote_sha
            remote_sha=$(gh api "repos/$ORG_NAME/$target_repo/contents/$file_path" --jq '.sha' 2>/dev/null || echo "")

            if [ -n "$remote_sha" ] && [ "$local_sha" = "$remote_sha" ]; then
              return 0
            fi

            local content
            content=$(base64 -w 0 "$file_path")

            local payload
            if [ -n "$remote_sha" ]; then
              payload=$(jq -n --arg msg "sync: update $file_path from $SOURCE_REPO" \
                             --arg content "$content" \
                             --arg sha "$remote_sha" \
                             '{message: $msg, content: $content, sha: $sha}')
            else
              payload=$(jq -n --arg msg "sync: add $file_path from $SOURCE_REPO" \
                             --arg content "$content" \
                             '{message: $msg, content: $content}')
            fi

            if ! gh api "repos/$ORG_NAME/$target_repo/contents/$file_path" -X PUT --input - <<< "$payload" > /dev/null 2>&1; then
              echo "::warning::Failed to update $file_path in $target_repo"
              return 1
            fi
            return 0
          }

          # 1. Fetch active, non-archived repositories in the organization
          REPOS=$(gh api "orgs/$ORG_NAME/repos?per_page=100" --paginate --jq '.[] | select(.archived == false and .disabled == false) | .name')

          for repo in $REPOS; do
            if [ "$repo" = "$SOURCE_REPO" ]; then
              continue
            fi

            echo ""
            echo "Updating governance assets for: $repo"

            REPO_FAILED=0

            # --- A. Asset Clustering & File Sync ---
            FILES_TO_SYNC=()

            EXTRA_FILES=(
              "SECURITY.md"
            )

            for file in "${EXTRA_FILES[@]}"; do
              [ -f "$file" ] && FILES_TO_SYNC+=("$file")
            done

            if [ -d "docs" ]; then
              while IFS= read -r file; do
                clean_file="${file#./}"
                [ -n "$clean_file" ] && FILES_TO_SYNC+=("$clean_file")
              done < <(find docs -type f)
            fi

            if [ -f ".github/PULL_REQUEST_TEMPLATE.md" ]; then
              FILES_TO_SYNC+=(".github/PULL_REQUEST_TEMPLATE.md")
            fi

            if [ -d ".github/ISSUE_TEMPLATE" ]; then
              while IFS= read -r file; do
                clean_file="${file#./}"
                [ -n "$clean_file" ] && FILES_TO_SYNC+=("$clean_file")
              done < <(find .github/ISSUE_TEMPLATE -type f)
            fi

            for file_path in "${FILES_TO_SYNC[@]}"; do
              if ! sync_file "$repo" "$file_path"; then
                REPO_FAILED=1
              fi
            done

            # --- B. Native Label Sync via gh label clone (without pruning) ---
            if ! gh label clone "$ORG_NAME/$SOURCE_REPO" --repo "$ORG_NAME/$repo" --force > /dev/null 2>&1; then
              echo "::warning::Failed to clone labels to $repo"
              REPO_FAILED=1
            fi

            if [ "$REPO_FAILED" -eq 1 ]; then
              FAIL_COUNT=$((FAIL_COUNT + 1))
              FAILED_REPOS+=("$repo")
            fi
          done

          # 2. Final summary check
          echo ""
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "::error::Governance sync failed for $FAIL_COUNT repository/repositories: ${FAILED_REPOS[*]}"
            exit 1
          else
            echo "Successfully distributed all governance assets and synced labels across all target repositories."
          fi
